name: Scrape tenders

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours — edit if you want a different cadence
  workflow_dispatch: {}      # lets you click "Run workflow" manually on GitHub too

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install --with-deps chromium

      - name: Run scraper
        run: python scripts/scrape.py

      - name: Commit updated data
        run: |
          git config user.name "tender-bot"
          git config user.email "tender-bot@users.noreply.github.com"
          git add data/tenders.json
          git diff --cached --quiet || git commit -m "Auto-update tenders $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
